<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#192332"><title>Pixel Gym · 街角健身室</title><link rel="stylesheet" href="style.css"></head>
<body><main class="scene" aria-label="全畫面健身室">
<canvas id="room" width="1200" height="675" tabindex="0" aria-label="健身室：方向鍵或 WASD 移動，E 使用附近器材，亦可點選地面走動"></canvas><div id="loading">正在打開健身室…</div>
<section class="member hud" aria-label="角色狀態"><div class="portrait"><img src="assets/runtime/c01-walk-v1.png" alt="棕髮主角 C01"></div><div><strong id="member-name">街角新會員</strong><small id="total">累積成長 0</small><span class="location">▐━▌ 街角健身室</span><button id="account-main" aria-controls="dialog">登入／建立角色</button></div></section>
<div class="top-right"><div class="tickets hud"><span id="ticket-icons" aria-hidden="true">▰ ▰ ▰</span><span>訓練券 <b id="tickets">3 / 3</b></span></div><div class="status-row"><button id="presence" class="presence hud" aria-label="開啟多人房間">● 開房邀請朋友</button><button id="help" class="hud square" aria-label="玩法說明">⚙</button></div><section class="objectives hud"><button id="toggle-goal" aria-expanded="true" aria-controls="goal-content">今日目標 <span id="goal-toggle-icon">−</span></button><div id="goal-content"><p><span>不同部位</span><b id="daily-count">0 / 3</b></p><div class="progress"><i id="daily-bar"></i></div><p><span>天台建設 <small>個人紀錄</small></span><b id="goal-count">0 / 8</b></p><div class="progress"><i id="goal-bar"></i></div></div></section></div>
<button id="near" class="hud" hidden></button><div id="toast" class="hud" role="status" hidden></div>
<div class="bottom-left"><div class="welcome hud"><span aria-hidden="true">☏</span><span id="welcome">歡迎返嚟，今日由一小步開始。</span></div><div class="room-help">WASD / 方向鍵移動 · E 使用 · 點選地板走動</div></div>
<nav class="quickbar" aria-label="遊戲選單"><button id="courses" class="hud" aria-expanded="false" aria-controls="courses-panel"><span aria-hidden="true">▦</span>課表</button><button id="profile" class="hud"><span aria-hidden="true">♙</span>角色</button><button id="friends" class="hud"><span aria-hidden="true">♧</span>房間</button><button id="emotes" class="hud"><span aria-hidden="true">☺</span>表情</button></nav>
<section id="courses-panel" class="hud drawer" aria-label="今日課表" hidden><div class="drawer-heading"><h2>今日課表</h2><button id="close-courses" aria-label="收起課表">✕</button></div><p class="subtle">五款訓練，每日揀三款。點選即行到器材旁。</p><button class="course" data-course="cardio"><span aria-hidden="true">↯</span><span><b>心肺訓練</b><small>跑步機 · 左右節奏</small></span><span id="cardio-state">前往</span></button><button class="course" data-course="push"><span aria-hidden="true">▐━▌</span><span><b>推力訓練</b><small>臥推 · 發力與接住</small></span><span id="push-state">前往</span></button><button class="course" data-course="pull"><span aria-hidden="true">↔</span><span><b>拉力訓練</b><small>划船機 · 拉動與回收</small></span><span id="pull-state">前往</span></button><button class="course" data-course="legs"><span aria-hidden="true">↓↑</span><span><b>腿部訓練</b><small>深蹲架 · 深度與控制</small></span><span id="legs-state">前往</span></button><button class="course" data-course="core"><span aria-hidden="true">◇</span><span><b>核心訓練</b><small>核心墊 · 重心平衡</small></span><span id="core-state">前往</span></button><p class="subtle">香港時間每日 04:00 補回 · 完成才扣券<br>同類每日正式訓練一次，自由練習不限次。</p><small id="date"></small></section>
<div class="touch-pad" aria-label="移動控制"><button data-move="up" aria-label="向上">↑</button><div><button data-move="left" aria-label="向左">←</button><button data-move="down" aria-label="向下">↓</button><button data-move="right" aria-label="向右">→</button></div></div>
<section id="dialog" class="hud floating-panel" aria-labelledby="dialog-title" hidden><div class="dialog-top"><span id="dialog-tag">訓練準備</span><button id="close" aria-label="關閉或暫停">✕</button></div><div id="dialog-body"></div></section><span id="save-state" class="save-state" role="status">進度儲存在這個瀏覽器</span>
</main><script type="module" src="src/app.mjs"></script></body></html>
